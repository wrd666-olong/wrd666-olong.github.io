<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World - olong的博客</title>
<style>
  :root {
    --bg: #f4f8ff;
    --fg: #334155;
    --muted: #7a8ba6;
    --accent: #3b82f6;
    --accent2: #38bdf8;
    --card: #ffffff;
    --border: #dbeafe;
    --shadow: 0 12px 30px rgba(59, 130, 246, .16);
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --fg: #e2e8f0;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --accent2: #818cf8;
    --card: #1e293b;
    --border: #334155;
    --shadow: 0 12px 30px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.85;
    transition: background .3s, color .3s;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .back {
    color: var(--accent);
    text-decoration: none;
    font-size: .9rem;
    font-weight: 600;
    transition: transform .2s;
  }
  .back:hover { transform: translateX(-3px); }
  .theme-btn {
    margin-left: auto;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    font-size: .95rem;
    transition: color .2s, border-color .2s, transform .2s;
  }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); transform: scale(1.08); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 60px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px;
    box-shadow: var(--shadow);
  }
  h1 {
    font-size: 1.7rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 24px; }
  h2 { font-size: 1.25rem; margin: 1.4em 0 .6em; }
  p { margin: .8em 0; }
  a { color: var(--accent); }
  code {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    color: var(--accent);
  }
  @media (max-width: 480px) { .card { padding: 22px; } }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="/">← 返回主页</a>
  <button class="theme-btn" id="themeBtn" type="button" title="切换主题">🌙</button>
</div>

<main class="wrap">
  <article class="card">
    <h1>Hello World</h1>
    <div class="meta">2026-09-22 · 随笔</div>
    <p>这是我博客的第一篇文章。以后我会把技术笔记、文档和想法都放在这里。</p>
    <h2>这是怎么工作的？</h2>
    <p>这个页面就是一个普通的 <code>.html</code> 文件，放在仓库的 <code>posts/</code> 目录里。
      主页会自动读取该目录并把文件列出来，点击就打开这个页面。</p>
    <h2>以后怎么加新文章</h2>
    <p>复制这个文件的写法，改个文件名和信息，放进 <code>posts/</code> 或 <code>docs/</code>，
      推送到 GitHub 即可，主页会自动出现链接。</p>
  </article>
</main>

<script>
  var root = document.documentElement;
  var themeBtn = document.getElementById('themeBtn');
  var saved = localStorage.getItem('theme');
  if (saved) root.setAttribute('data-theme', saved);
  function syncTheme() {
    themeBtn.textContent = root.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncTheme();
  themeBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    syncTheme();
  });
</script>
</body>
</html>
