<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wireshark抓包 - olong的博客</title>
<style>
  :root {
    --bg: #f4f8ff;
    --fg: #334155;
    --muted: #7a8ba6;
    --accent: #3b82f6;
    --accent2: #38bdf8;
    --card: #ffffff;
    --border: #dbeafe;
    --shadow: 0 12px 30px rgba(59, 130, 246, .16);
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --fg: #e2e8f0;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --accent2: #818cf8;
    --card: #1e293b;
    --border: #334155;
    --shadow: 0 12px 30px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.85;
    transition: background .3s, color .3s;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .back {
    color: var(--accent);
    text-decoration: none;
    font-size: .9rem;
    font-weight: 600;
    transition: transform .2s;
  }
  .back:hover { transform: translateX(-3px); }
  .theme-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    font-size: .95rem;
    transition: color .2s, border-color .2s, transform .2s;
  }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); transform: scale(1.08); }
  .stats {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: .82rem;
    color: var(--muted);
  }
  .stat { display: inline-flex; align-items: center; gap: 4px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 60px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px;
    box-shadow: var(--shadow);
  }
  h1 {
    font-size: 1.7rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 24px; }
  h2 { font-size: 1.25rem; margin: 1.6em 0 .6em; }
  h2.num {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: .8rem;
    padding: 2px 12px;
    border-radius: 999px;
    margin: 1.8em 0 .4em;
  }
  p { margin: .8em 0; }
  a { color: var(--accent); }
  img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 12px 0 4px;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(59, 130, 246, .12);
    cursor: zoom-in;
    transition: transform .25s;
  }
  img:hover { transform: scale(1.01); }
  code {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    color: var(--accent);
  }
  @media (max-width: 480px) { .card { padding: 22px; } }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="/">← 返回主页</a>
  <span class="stats">
    <span class="stat" title="浏览次数">👁 <span id="viewCount">–</span></span>
  </span>
  <button class="theme-btn" id="themeBtn" type="button" title="切换主题">🌙</button>
</div>

<main class="wrap">
  <article class="card">
    <h1>wireshark抓包</h1>
    <div class="meta">2026-10-14 · 抓包</div>

    <p>wireshark 是一个功能强大的抓包软件。</p>
    <p>与 bp 抓包相比，它能抓取 arp、udp、DNS 等多种包。</p>

    <h2>功能演示</h2>
    <p>对于一个网页来说，登录密码一般都是经过加密传输，这里以 TLS 加密为例。</p>

    <h2>找到一个网站</h2>
    <p>我们随便找到一个网址，F12 查看网址，然后用 wireshark 过滤抓包，结果发现密码和账号是加密的。</p>

    <h2 class="num">1</h2>
    <img src="../drafts/1.png" alt="1" loading="lazy">

    <h2>解密处理</h2>
    <p>TLS 解密需要我们在客户端配置密钥来解密，这边已经配置完成。</p>

    <h2 class="num">2</h2>
    <img src="../drafts/2.png" alt="2" loading="lazy">

    <p>这边可以看到 TLS 包被解析成了 http 包，并且密码和账号都能看到。</p>

    <h2 class="num">3</h2>
    <img src="../drafts/3.png" alt="3" loading="lazy">
  </article>
</main>

<script>
  var root = document.documentElement;
  var themeBtn = document.getElementById('themeBtn');
  var saved = localStorage.getItem('theme');
  if (saved) root.setAttribute('data-theme', saved);
  function syncTheme() {
    themeBtn.textContent = root.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncTheme();
  themeBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    syncTheme();
  });
  document.querySelectorAll('article img').forEach(function (img) {
    img.addEventListener('click', function () { window.open(img.src, '_blank'); });
  });
</script>
<script src="/stats.js?v=3"></script>
</body>
</html>
