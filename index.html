<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的博客</title>
<meta name="description" content="个人博客 - 记录技术与生活">
<style>
  :root {
    --bg: #ffffff;
    --fg: #24292f;
    --muted: #57606a;
    --accent: #0969da;
    --border: #d0d7de;
    --card: #f6f8fa;
  }
  [data-theme="dark"] {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --border: #30363d;
    --card: #161b22;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    transition: background .2s, color .2s;
  }
  .container { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header {
    border-bottom: 1px solid var(--border);
    padding: 28px 0 20px;
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .site-title { font-size: 1.5rem; font-weight: 700; }
  .site-title a { color: var(--fg); text-decoration: none; }
  .site-title a:hover { color: var(--accent); }
  .site-desc { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .theme-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: .85rem;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
  main { padding: 36px 0; }
  h2 { font-size: 1.15rem; margin-bottom: 18px; }
  .post-list { list-style: none; }
  .post-list li {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .post-list li:first-child { border-top: 1px solid var(--border); }
  .post-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }
  .post-title:hover { text-decoration: underline; }
  .post-meta { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .post-excerpt { color: var(--muted); font-size: .92rem; margin-top: 6px; }
  .tag {
    display: inline-block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 10px;
    font-size: .75rem;
    color: var(--muted);
    margin-left: 8px;
  }
  footer {
    border-top: 1px solid var(--border);
    padding: 24px 0 40px;
    color: var(--muted);
    font-size: .85rem;
    text-align: center;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  @media (max-width: 480px) {
    .site-title { font-size: 1.25rem; }
    main { padding: 24px 0; }
  }
</style>
</head>
<body>
<header>
  <div class="container header-inner">
    <div>
      <div class="site-title"><a href="/">我的博客</a></div>
      <div class="site-desc">记录技术与生活</div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">🌙 暗色</button>
  </div>
</header>

<main>
  <div class="container">
    <h2>最新文章</h2>
    <ul class="post-list">
      <li>
        <a class="post-title" href="posts/hello-world.html">Hello World</a>
        <span class="tag">随笔</span>
        <div class="post-meta">2026-09-22</div>
        <p class="post-excerpt">博客的第一篇文章，介绍一下这个站点以及之后打算写些什么。</p>
      </li>
      <li>
        <a class="post-title" href="posts/getting-started.html">从零搭建 GitHub Pages 博客</a>
        <span class="tag">教程</span>
        <div class="post-meta">2026-09-20</div>
        <p class="post-excerpt">使用 GitHub Pages 免费托管静态博客的完整步骤。</p>
      </li>
      <li>
        <a class="post-title" href="posts/reading-notes.html">近期读书笔记</a>
        <span class="tag">读书</span>
        <div class="post-meta">2026-09-15</div>
        <p class="post-excerpt">记录最近读过的几本书和一些想法。</p>
      </li>
    </ul>
  </div>
</main>

<footer>
  <div class="container">
    © <span id="year"></span> 我的博客 · Powered by
    <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>
  </div>
</footer>

<script>
  var root = document.documentElement;
  var btn = document.getElementById('themeBtn');
  var saved = localStorage.getItem('theme');
  if (saved) root.setAttribute('data-theme', saved);
  function syncBtn() {
    btn.textContent = root.getAttribute('data-theme') === 'dark' ? '☀️ 亮色' : '🌙 暗色';
  }
  syncBtn();
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    syncBtn();
  });
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
