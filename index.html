<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的博客</title>
<meta name="description" content="个人博客 - 记录技术与生活">
<style>
  :root {
    --bg: #fffafc;
    --fg: #4a4453;
    --muted: #8b8494;
    --pink: #ff8ab8;
    --accent: #f472b6;
    --card: #ffffff;
    --border: #ffe3ef;
    --shadow: 0 12px 30px rgba(244, 114, 182, .14);
    --hero: linear-gradient(135deg, #ffe1ef 0%, #fff6fb 45%, #e9f1ff 100%);
  }
  [data-theme="dark"] {
    --bg: #17141d;
    --fg: #eae6f0;
    --muted: #a49dae;
    --pink: #ff9ec4;
    --accent: #ff9ec4;
    --card: #211c2a;
    --border: #332b3e;
    --shadow: 0 12px 30px rgba(0, 0, 0, .35);
    --hero: linear-gradient(135deg, #2b1e30 0%, #17141d 45%, #1b2030 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    transition: background .3s, color .3s;
  }

  /* ---------- 首屏 ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background: var(--hero);
    background-size: 200% 200%;
    animation: heroMove 12s ease-in-out infinite;
  }
  @keyframes heroMove {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .hero-inner { position: relative; z-index: 2; padding: 20px; }
  .avatar {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--card);
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    animation: bob 4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .site-title {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), #b388ff, var(--accent));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .site-sub {
    color: var(--muted);
    margin-top: 10px;
    font-size: 1rem;
    min-height: 1.7em;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    vertical-align: -2px;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .scroll-down {
    display: inline-block;
    margin-top: 34px;
    font-size: 1.6rem;
    color: var(--accent);
    text-decoration: none;
    animation: bounce 1.8s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: .6; }
    50% { transform: translateY(8px); opacity: 1; }
  }

  /* 落樱 */
  .petals { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .petal {
    position: absolute;
    top: -8%;
    font-size: 16px;
    opacity: .8;
    animation: fall linear infinite;
  }
  @keyframes fall {
    to { transform: translateY(115vh) rotate(360deg); }
  }

  /* 波浪 */
  .wave {
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 100%;
    height: 90px;
    z-index: 1;
  }
  .wave path { fill: var(--bg); transition: fill .3s; }

  /* ---------- 内容 ---------- */
  .container { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  main { padding: 40px 0 20px; }
  h2 {
    font-size: 1.25rem;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2::before {
    content: "";
    width: 4px;
    height: 1.1em;
    border-radius: 2px;
    background: linear-gradient(var(--accent), #b388ff);
  }

  .post-list { list-style: none; display: grid; gap: 14px; }
  .post-list li {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: 0 4px 14px rgba(244, 114, 182, .07);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .post-list li:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: var(--accent);
  }
  .post-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--fg);
    text-decoration: none;
    transition: color .2s;
  }
  .post-list li:hover .post-title { color: var(--accent); }
  .post-meta { color: var(--muted); font-size: .82rem; margin-top: 6px; }
  .tag {
    display: inline-block;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--accent);
    border-radius: 999px;
    padding: 1px 10px;
    font-size: .72rem;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .empty { color: var(--muted); font-size: .9rem; padding: 10px 0; }
  .hint {
    margin-top: 24px;
    color: var(--muted);
    font-size: .82rem;
    text-align: center;
  }
  .hint code {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    color: var(--accent);
  }

  /* 滚动出现 */
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .5s, transform .5s; }
  .reveal.visible { opacity: 1; transform: none; }

  footer {
    padding: 30px 0 44px;
    color: var(--muted);
    font-size: .82rem;
    text-align: center;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* 悬浮按钮 */
  .theme-btn, #toTop {
    position: fixed;
    right: 20px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
    cursor: pointer;
    font-size: 1rem;
    box-shadow: var(--shadow);
    z-index: 50;
    transition: transform .2s, color .2s, border-color .2s;
  }
  .theme-btn { top: 20px; }
  .theme-btn:hover, #toTop:hover { color: var(--accent); border-color: var(--accent); transform: scale(1.08); }
  #toTop {
    bottom: 20px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
    transition: opacity .3s, transform .3s, color .2s, border-color .2s;
  }
  #toTop.show { opacity: 1; pointer-events: auto; transform: none; }

  @media (max-width: 480px) {
    .site-title { font-size: 1.8rem; }
    .avatar { width: 84px; height: 84px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<button class="theme-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">🌙</button>

<header class="hero">
  <div class="petals" id="petals" aria-hidden="true"></div>
  <div class="hero-inner">
    <img class="avatar" id="avatar" alt="avatar">
    <h1 class="site-title">我的博客</h1>
    <p class="site-sub"><span id="typed"></span><span class="cursor"></span></p>
    <a class="scroll-down" href="#posts" aria-label="向下滚动">⌄</a>
  </div>
  <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,64 C240,120 480,0 720,32 C960,64 1200,120 1440,64 L1440,120 L0,120 Z"></path>
  </svg>
</header>

<main id="posts">
  <div class="container">
    <h2>文章与文档</h2>
    <ul class="post-list" id="postList">
      <li class="reveal">
        <a class="post-title" href="posts/hello-world.html">Hello World</a>
        <span class="tag">随笔</span>
        <div class="post-meta">2026-09-22</div>
      </li>
      <li class="reveal">
        <a class="post-title" href="posts/getting-started.html">从零搭建 GitHub Pages 博客</a>
        <span class="tag">教程</span>
        <div class="post-meta">2026-09-20</div>
      </li>
      <li class="reveal">
        <a class="post-title" href="posts/reading-notes.html">近期读书笔记</a>
        <span class="tag">读书</span>
        <div class="post-meta">2026-09-15</div>
      </li>
    </ul>
    <div class="empty" id="loading" hidden>正在加载文档列表…</div>
    <p class="hint">
      把文件放进 <code>posts/</code> 或 <code>docs/</code> 目录并推送后会自动出现在这里
    </p>
  </div>
</main>

<footer>
  <div class="container">
    © <span id="year"></span> 我的博客 · Powered by
    <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>
  </div>
</footer>

<button id="toTop" type="button" title="回到顶部" aria-label="回到顶部">↑</button>

<script>
  /* ---------- 主题 ---------- */
  var root = document.documentElement;
  var themeBtn = document.getElementById('themeBtn');
  var saved = localStorage.getItem('theme');
  if (saved) root.setAttribute('data-theme', saved);
  function syncTheme() {
    themeBtn.textContent = root.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncTheme();
  themeBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    syncTheme();
  });

  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---------- 头像（取自 GitHub） ---------- */
  var host = location.hostname;
  var user = /\.github\.io$/.test(host) ? host.replace('.github\.io', '') : 'wrd666-olong';
  var avatar = document.getElementById('avatar');
  avatar.src = 'https://github.com/' + user + '.png?size=200';
  avatar.onerror = function () {
    this.onerror = null;
    this.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">' +
      '<rect width="200" height="200" fill="#ffd9e8"/>' +
      '<text x="100" y="120" font-size="90" text-anchor="middle">🌸</text></svg>');
  };

  /* ---------- 打字机副标题 ---------- */
  (function () {
    var text = '记录技术与生活';
    var el = document.getElementById('typed');
    var i = 0;
    (function type() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i++);
        setTimeout(type, 150);
      }
    })();
  })();

  /* ---------- 落樱 ---------- */
  (function () {
    var box = document.getElementById('petals');
    var chars = ['🌸', '🌷', '❀', '✿'];
    for (var i = 0; i < 10; i++) {
      var s = document.createElement('span');
      s.className = 'petal';
      s.textContent = chars[i % chars.length];
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDuration = (8 + Math.random() * 8) + 's';
      s.style.animationDelay = (-Math.random() * 12) + 's';
      s.style.fontSize = (12 + Math.random() * 10) + 'px';
      box.appendChild(s);
    }
  })();

  /* ---------- 滚动：回到顶部 ---------- */
  var toTop = document.getElementById('toTop');
  window.addEventListener('scroll', function () {
    toTop.classList.toggle('show', window.scrollY > 300);
  }, { passive: true });
  toTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ---------- 滚动出现 ---------- */
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.12 });
  function observeReveals() {
    document.querySelectorAll('.reveal:not(.visible)').forEach(function (el) {
      observer.observe(el);
    });
  }
  observeReveals();

  /* ---------- 自动列出 posts/ 与 docs/ ---------- */
  var REPO = /\.github\.io$/.test(host) ? user + '/' + host : 'wrd666-olong/wrd666-olong.github.io';
  var BRANCH = 'main';
  var DIRS = ['posts', 'docs'];
  var ICONS = { html: '🌐', htm: '🌐', md: '📝', pdf: '📄', txt: '📃',
                png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', svg: '🖼️',
                zip: '🗜️', json: '🧩' };

  function linkFor(path, name) {
    return /\.md$/i.test(name)
      ? 'https://github.com/' + REPO + '/blob/' + BRANCH + '/' + path
      : './' + path;
  }

  function renderDocs(files) {
    var list = document.getElementById('postList');
    list.innerHTML = '';
    files.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); });
    files.forEach(function (f) {
      var ext = (f.name.split('.').pop() || '').toLowerCase();
      var li = document.createElement('li');
      li.className = 'reveal';
      var a = document.createElement('a');
      a.className = 'post-title';
      a.href = linkFor(f.path, f.name);
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = (ICONS[ext] ? ICONS[ext] + ' ' : '') + f.name.replace(/\.[^.]+$/, '');
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = ext || f.dir;
      var meta = document.createElement('div');
      meta.className = 'post-meta';
      meta.textContent = f.path;
      li.appendChild(a);
      li.appendChild(tag);
      li.appendChild(meta);
      list.appendChild(li);
    });
    observeReveals();
  }

  (function loadDocs() {
    var loading = document.getElementById('loading');
    loading.hidden = false;
    var jobs = DIRS.map(function (dir) {
      return fetch('https://api.github.com/repos/' + REPO + '/contents/' + dir +
                   '?ref=' + BRANCH + '&t=' + Date.now())
        .then(function (r) { return r.ok ? r.json() : []; })
        .catch(function () { return []; });
    });
    Promise.all(jobs).then(function (results) {
      var files = [];
      results.forEach(function (data, idx) {
        if (!Array.isArray(data)) return;
        data.forEach(function (f) {
          if (f.type !== 'file' || f.name.charAt(0) === '.') return;
          files.push({ name: f.name, path: f.path, dir: DIRS[idx] });
        });
      });
      loading.hidden = true;
      if (files.length) renderDocs(files);
    });
  })();
</script>
</body>
</html>
