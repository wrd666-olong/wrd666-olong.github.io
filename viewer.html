<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档查看 - olong的博客</title>
<style>
  :root {
    --bg: #f4f8ff;
    --fg: #334155;
    --muted: #7a8ba6;
    --accent: #3b82f6;
    --accent2: #38bdf8;
    --card: #ffffff;
    --border: #dbeafe;
    --shadow: 0 12px 30px rgba(59, 130, 246, .16);
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --fg: #e2e8f0;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --accent2: #818cf8;
    --card: #1e293b;
    --border: #334155;
    --shadow: 0 12px 30px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.8;
    transition: background .3s, color .3s;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    text-decoration: none;
    font-size: .9rem;
    font-weight: 600;
    transition: transform .2s;
  }
  .back:hover { transform: translateX(-3px); }
  .doc-title {
    flex: 1;
    font-weight: 700;
    font-size: 1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .theme-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    font-size: .95rem;
    transition: color .2s, border-color .2s, transform .2s;
  }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); transform: scale(1.08); }
  .stats { display: inline-flex; align-items: center; gap: 12px; font-size: .82rem; color: var(--muted); }
  .stat { display: inline-flex; align-items: center; gap: 4px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 60px; }
  .status {
    color: var(--muted);
    font-size: .92rem;
    padding: 20px 0;
  }
  .status.error { color: #e5484d; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: var(--shadow);
  }
  .download {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 22px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 9px 18px;
    border-radius: 10px;
    font-size: .85rem;
    font-weight: 600;
    transition: transform .2s, background .2s;
  }
  .download:hover { transform: translateY(-2px); background: var(--accent2); }
  article h1, article h2, article h3 { margin: 1.2em 0 .5em; line-height: 1.35; }
  article h1 { font-size: 1.6rem; }
  article h2 { font-size: 1.3rem; }
  article h3 { font-size: 1.1rem; }
  article p { margin: .7em 0; }
  article ul, article ol { margin: .7em 0 .7em 1.4em; }
  article img { max-width: 100%; height: auto; border-radius: 8px; margin: .6em 0; }
  article table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  article th, article td { border: 1px solid var(--border); padding: 8px 10px; }
  article a { color: var(--accent); }
  article pre, article blockquote {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow: auto;
  }
  article blockquote { border-left: 4px solid var(--accent); }
  iframe.pdf { width: 100%; height: 78vh; border: 1px solid var(--border); border-radius: 10px; }
  @media (max-width: 480px) { .card { padding: 20px; } }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="/">← 返回主页</a>
  <span class="doc-title" id="docTitle">文档查看</span>
  <span class="stats">
    <span class="stat" title="浏览次数">👁 <span id="viewCount">–</span></span>
  </span>
  <button class="theme-btn" id="themeBtn" type="button" title="切换主题">🌙</button>
</div>

<main class="wrap">
  <div id="status" class="status">正在加载…</div>
  <article id="content"></article>
</main>

<script>
  (function () {
    var root = document.documentElement;
    var themeBtn = document.getElementById('themeBtn');
    var saved = localStorage.getItem('theme');
    if (saved) root.setAttribute('data-theme', saved);
    function syncTheme() {
      themeBtn.textContent = root.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    }
    syncTheme();
    themeBtn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      syncTheme();
    });

    var status = document.getElementById('status');
    var content = document.getElementById('content');
    var titleEl = document.getElementById('docTitle');

    var file = new URLSearchParams(location.search).get('file');
    if (!file) {
      status.className = 'status error';
      status.textContent = '缺少参数：请通过 ?file=文档路径 访问。';
      return;
    }

    var name = decodeURIComponent(file.split('/').pop());
    var ext = (name.split('.').pop() || '').toLowerCase();
    document.title = name.replace(/\.[^.]+$/, '') + ' - olong的博客';
    titleEl.textContent = name;

    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = function () { reject(new Error('加载失败: ' + src)); };
        document.head.appendChild(s);
      });
    }

    function fail(msg) {
      status.className = 'status error';
      status.textContent = msg;
    }

    var url = './' + file;
    var downloadHTML = '<a class="download" href="' + url + '" download>⬇ 下载原文件</a>';

    if (ext === 'pdf') {
      status.hidden = true;
      content.innerHTML = '<iframe class="pdf" src="' + url + '"></iframe>' + downloadHTML;
      return;
    }
    if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp'].indexOf(ext) !== -1) {
      status.hidden = true;
      content.innerHTML = '<img src="' + url + '" alt="' + name + '">' + downloadHTML;
      return;
    }
    if (ext === 'html' || ext === 'htm') {
      status.hidden = true;
      content.innerHTML = '<iframe src="' + url + '" style="width:100%;height:78vh;border:1px solid var(--border);border-radius:10px"></iframe>';
      return;
    }

    status.textContent = '正在加载文档…';
    fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error('找不到文件（HTTP ' + r.status + '）');
        return r;
      })
      .then(function (r) { return r.arrayBuffer(); })
      .then(function (buf) {
        var data = ext === 'docx' ? buf : new TextDecoder('utf-8').decode(buf);
        if (ext === 'docx') return renderDocx(data);
        if (ext === 'md' || ext === 'markdown') return renderMd(data);
        if (ext === 'txt' || ext === 'json' || ext === 'log' || ext === 'csv') return renderText(data);
        // 其他类型不预览，直接给下载
        status.hidden = true;
        content.innerHTML = '<div class="card"><p>该文件类型暂不支持在线预览。</p>' + downloadHTML + '</div>';
      })
      .catch(function (e) { fail(e.message || '加载失败'); });

    function renderText(text) {
      status.hidden = true;
      content.innerHTML = '<div class="card"><pre>' +
        text.replace(/[&<>]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
        }) + '</pre>' + downloadHTML + '</div>';
    }

    function renderMd(text) {
      return loadScript('https://cdn.jsdelivr.net/npm/marked/marked.min.js')
        .then(function () {
          status.hidden = true;
          content.innerHTML = '<div class="card">' + window.marked.parse(text) + '</div>' + downloadHTML;
        });
    }

    function renderDocx(buf) {
      return loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js')
        .then(function () {
          return window.mammoth.convertToHtml({ arrayBuffer: buf });
        })
        .then(function (result) {
          status.hidden = true;
          content.innerHTML = '<div class="card">' + result.value + '</div>' + downloadHTML;
        });
    }
  })();
</script>
<script src="/stats.js?v=3"></script>
</body>
</html>
